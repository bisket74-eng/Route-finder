<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>USPS Route Finder - Vancouver WA</title>

<style>
:root { --bl:#004b87; --lt-bl:#eef4f9; --rd:#da291c; --yl:#ffde00; }

html, body {
    margin:0; padding:0; height:100%; width:100%; overflow:hidden;
    background:#d1dee8;
    font-family:Segoe UI, Roboto, Helvetica, Arial, sans-serif;
    display:flex; justify-content:center;
}

.app-container {
    width:100%; max-width:600px;
    background:var(--lt-bl);
    display:flex; flex-direction:column;
    height:100vh;
    box-shadow:0 0 50px rgba(0,0,0,0.2);
}

.hdr {
    background:linear-gradient(135deg,#003a6a,#004b87,#005fa3);
    padding:22px 15px;
    text-align:center;
    color:white;
}

.usps-sig { font-size:3rem; font-weight:900; font-style:italic; }
.vanc-text { font-size:1.3rem; font-weight:900; text-transform:uppercase; }
.rt-finder-text { font-size:0.9rem; font-weight:900; color:var(--yl); }

.sticky-top { position:sticky; top:0; background:var(--lt-bl); }

.ctrls { padding:15px; }

.row { display:flex; gap:10px; margin-bottom:10px; }

.zip-trigger {
    width:100%;
    padding:14px;
    border:1px solid #aaa;
    background:white;
    font-weight:700;
}

.zip-checklist {
    position:absolute;
    background:white;
    border:3px solid var(--bl);
    display:none;
    max-height:300px;
    overflow:auto;
}

.zip-item { display:flex; padding:10px; font-weight:700; }

.apply-btn {
    width:100%;
    padding:12px;
    background:var(--bl);
    color:white;
    font-weight:900;
}

input[type="text"] {
    width:100%;
    padding:14px;
    font-size:18px;
}

.sug {
    position:absolute;
    background:white;
    width:100%;
    max-height:250px;
    overflow:auto;
    display:none;
    border:2px solid var(--bl);
}

.s-item {
    padding:12px;
    display:flex;
    justify-content:space-between;
    font-weight:700;
}

.list-card {
    background:white;
    margin:10px;
    padding:15px;
    border:2px solid var(--bl);
    display:flex;
    justify-content:space-between;
}

.rt-block { background:var(--bl); color:white; padding:10px; }

#list-res { flex:1; overflow:auto; padding:10px; }
</style>
</head>

<body id="mainBody">

<div class="app-container">

<div class="hdr">
    <div class="usps-sig">USPS</div>
    <div class="vanc-text">Vancouver, WA</div>
    <div class="rt-finder-text">Route Finder</div>
</div>

<div class="sticky-top">
<div class="ctrls">

<div class="row">
<div class="zip-trigger" id="zipTrig" onclick="toggleZipList(event)">Select Zip(s)...</div>

<div class="zip-checklist" id="zipList">
<label class="zip-item"><input type="checkbox" class="z-chk" value="98660" onchange="syncMaster()">98660</label>
<label class="zip-item"><input type="checkbox" class="z-chk" value="98661" onchange="syncMaster()">98661</label>
<label class="zip-item"><input type="checkbox" class="z-chk" value="98662" onchange="syncMaster()">98662</label>
<button class="apply-btn" onclick="finalApply(event)">Apply</button>
</div>

</div>

<input type="text" id="streetInput" placeholder="Select ZIP first..." disabled oninput="handleSearch()">
<div class="sug" id="suggestionBox"></div>

</div>
</div>

<div id="list-res"><div id="cc"></div></div>

</div>

<script>

let database = {};
let currentOpenStreet = null;

const strIn = document.getElementById('streetInput');
const sugBox = document.getElementById('suggestionBox');
const cardCont = document.getElementById('cc');

window.onload = async () => {
    try {
        const res = await fetch('data.csv');
        const text = await res.text();

        const lines = text.split('\n').filter(l => l.trim());
        const start = /^[A-Za-z]/.test(lines[0]) ? 1 : 0;

        const nDB = {};

        lines.slice(start).forEach(line => {
            const c = line.split(',');

            if (c.length < 9) return;

            const z = c[7]?.trim();
            const nm = c[4]?.trim();
            if (!z || !nm) return;

            if (!nDB[z]) nDB[z] = [];

            const fNm = [c[3], c[4], c[5], c[6]]
                .filter(Boolean)
                .join(" ");

            let st = nDB[z].find(s => s.displayName === fNm);

            if (!st) {
                st = { searchName: nm.toUpperCase(), displayName: fNm, results: [] };
                nDB[z].push(st);
            }

            st.results.push({
                range: c[0] + (c[1] ? "-" + c[1] : ""),
                route: c[8]
            });
        });

        database = nDB;

        console.log("Loaded ZIPs:", Object.keys(database).length);

    } catch (e) {
        console.error("CSV load failed", e);
    }
};

function toggleZipList(e) {
    e.stopPropagation();
    const list = document.getElementById('zipList');
    list.style.display = list.style.display === 'block' ? 'none' : 'block';
}

function syncMaster() {}

function finalApply() {
    document.getElementById('zipList').style.display = 'none';
    strIn.disabled = false;
    strIn.placeholder = "Enter street name...";
}

function handleSearch() {
    const val = strIn.value.toUpperCase().trim();

    sugBox.innerHTML = "";
    cardCont.innerHTML = "";

    if (!val) return;

    let results = [];

    document.querySelectorAll('.z-chk:checked').forEach(z => {
        const zip = z.value;

        if (database[zip]) {
            database[zip].forEach(st => {
                if (st.searchName.startsWith(val)) {
                    results.push({...st, zip});
                }
            });
        }
    });

    sugBox.style.display = results.length ? 'block' : 'none';

    results.slice(0, 100).forEach(item => {
        const div = document.createElement('div');
        div.className = "s-item";
        div.innerHTML = `<span>${item.displayName}</span><span>${item.zip}</span>`;
        div.onclick = () => selectStreet(item);
        sugBox.appendChild(div);
    });
}

function selectStreet(item) {
    sugBox.style.display = "none";
    cardCont.innerHTML = "";

    item.results.forEach(r => {
        const div = document.createElement('div');
        div.className = "list-card";

        div.innerHTML = `
            <div>${item.displayName}<br>${r.range}<br>ZIP ${item.zip}</div>
            <div class="rt-block">${r.route}</div>
        `;

        cardCont.appendChild(div);
    });
}

</script>

</body>
</html>
