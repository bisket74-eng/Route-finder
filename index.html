<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vancouver Route Finder</title>
    <style>
        :root {
            --usps-blue: #004b87;
            --usps-red: #da291c;
            --usps-yellow: #ffde00;
            --scroll-blue: #82caff;
            --bg-color: #f4f7f9;
        }

        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: var(--bg-color);
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            overflow: hidden;
        }

        #banner-wrap { transition: all 0.2s ease; }
        body.searching #banner-wrap { display: none; }

        .header {
            background-color: var(--usps-blue);
            padding: 18px 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .usps-signature {
            color: white;
            font-size: 2rem;
            font-weight: 900;
            font-style: italic;
            letter-spacing: -3px;
            line-height: 0.8;
            font-family: "Arial Black", sans-serif;
            transform: skewX(-5deg);
        }

        .vancouver-text {
            color: white;
            font-size: 1.5rem;
            font-weight: 900;
            text-transform: uppercase;
        }

        .route-finder-cool {
            margin-top: 2px;
            font-size: 0.9rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: var(--usps-yellow);
        }

        .header-accent { height: 6px; background-color: var(--usps-red); width: 100%; }

        .sticky-controls {
            position: sticky;
            top: 0;
            z-index: 3000;
            background-color: var(--bg-color);
            padding: 10px;
        }

        .input-container { max-width: 450px; margin: 0 auto; position: relative; }
        .input-row { display: flex; gap: 10px; align-items: flex-end; margin-bottom: 12px; }
        .input-wrapper { flex: 1; position: relative; }

        label { display: block; margin-bottom: 3px; font-size: 0.75rem; font-weight: bold; color: #333; text-transform: uppercase; }

        select, input {
            width: 100%;
            padding: 12px;
            border: 2px solid #bbb;
            border-radius: 8px;
            font-size: 18px;
            box-sizing: border-box;
            background: white;
            color: #000;
        }

        .btn-action { height: 48px; width: 90px; border-radius: 8px; border: none; font-weight: 900; font-size: 0.6rem; text-transform: uppercase; }
        .reset-all { background-color: var(--usps-red); color: white; }
        .reset-street { background-color: var(--usps-yellow); color: #000; }

        /* THE COMPACT 5.5 ITEM STRIPED LIST */
        .suggestion-box {
            background: #e5e5e5; 
            border: 2px solid var(--usps-blue); 
            border-top: none;
            border-radius: 0 0 12px 12px;
            
            /* Shortened to force a mid-text slice on the 6th item */
            height: 235px; 
            max-height: 235px; 
            
            overflow-y: auto;
            display: none;
            position: absolute;
            top: 100%; 
            left: 0;
            right: 0;
            z-index: 9999;
            padding: 4px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .suggestion-item {
            height: 48px; /* Slightly tighter rows */
            padding: 0 20px;
            display: flex;
            align-items: center;
            background: white;
            margin-bottom: 4px; 
            border-radius: 6px;
            border-bottom: 2px solid #ccc; 
            font-size: 1.2rem;
            font-weight: 900;
            color: var(--usps-blue);
            box-sizing: border-box;
            white-space: nowrap;
        }

        .suggestion-item:last-child { margin-bottom: 0; }
        .suggestion-item:active { background: var(--usps-yellow); }

        .suggestion-box::-webkit-scrollbar { width: 14px; }
        .suggestion-box::-webkit-scrollbar-thumb {
            background: var(--scroll-blue);
            border-radius: 10px;
            border: 2px solid var(--usps-blue);
        }

        #resultArea { padding: 10px 15px; height: calc(100vh - 150px); overflow-y: auto; }
        .result-card {
            background: white;
            border-radius: 10px;
            padding: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #ccc;
        }

        .range-display { font-size: 1.5rem; font-weight: 900; color: #000; }
        .route-side { background-color: var(--usps-blue); color: white; padding: 10px; border-radius: 8px; text-align: center; min-width: 80px; }
        .route-side .lbl { font-size: 0.6rem; font-weight: bold; display: block; }
        .route-side .num { font-size: 1.6rem; font-weight: 900; display: block; }
    </style>
</head>
<body>

    <div id="banner-wrap">
        <div class="header">
            <span class="usps-signature">USPS</span>
            <div class="vancouver-text">VANCOUVER, WA</div>
            <div class="route-finder-cool">ROUTE FINDER</div>
        </div>
        <div class="header-accent"></div>
    </div>

    <div class="sticky-controls">
        <div class="input-container">
            <div class="input-row">
                <div class="input-wrapper">
                    <label>Zip Code</label>
                    <select id="zipCode" onchange="clearStreetOnly()">
                        <option value="">Select ZIP...</option>
                        <option value="98662">98662 (Trial Data)</option>
                        <option value="98660">98660</option>
                        <option value="98661">98661</option>
                        <option value="98668">98668</option>
                        <option value="98682">98682</option>
                    </select>
                </div>
                <button class="btn-action reset-all" onclick="fullAppReset()">Reset<br>All</button>
            </div>

            <div class="input-row">
                <div class="input-wrapper">
                    <label>Street Name</label>
                    <input type="text" id="streetInput" placeholder="Start typing street..." autocomplete="off" oninput="handleSearch()" onfocus="enterFocus()" onblur="exitFocus()">
                    <div id="suggestionBox" class="suggestion-box"></div>
                </div>
                <button class="btn-action reset-street" onclick="clearStreetOnly()">Reset<br>Street</button>
            </div>
        </div>
    </div>

    <div id="resultArea"><div id="cardContainer"></div></div>

    <script>
        const database = {
            "98662": [
                { name: "1st Street", results: [{ range: "100-998", route: "C001" }] },
                { name: "18th Circle", results: [{ range: "1800-1899", route: "C018" }] },
                { name: "180th Street", results: [{ range: "18000-18099", route: "C080" }] },
                { name: "181st Street", results: [{ range: "18100-18199", route: "C081" }] },
                { name: "182nd Street", results: [{ range: "18200-18299", route: "C082" }] },
                { name: "183rd Street", results: [{ range: "18300-18399", route: "C083" }] },
                { name: "184th Street", results: [{ range: "18400-18499", route: "C084" }] },
                { name: "185th Circle", results: [{ range: "18500-18599", route: "C085" }] },
                { name: "186th Avenue", results: [{ range: "18600-18699", route: "C086" }] },
                { name: "187th Avenue", results: [{ range: "18700-18799", route: "C087" }] },
                { name: "188th Street", results: [{ range: "18800-18899", route: "C088" }] },
                { name: "189th Street", results: [
                    { range: "100-500", route: "C001" },
                    { range: "501-999", route: "C010" },
                    { range: "1000-1500", route: "C022" },
                    { range: "1501-2000", route: "C033" },
                    { range: "2001-2500", route: "C044" },
                    { range: "2501-3000", route: "C055" },
                    { range: "3001-3500", route: "C066" },
                    { range: "3501-4000", route: "C077" },
                    { range: "4001-5000", route: "C099" }
                ]}
            ]
        };

        const zipIn = document.getElementById('zipCode');
        const strIn = document.getElementById('streetInput');
        const sugBox = document.getElementById('suggestionBox');
        const cardCont = document.getElementById('cardContainer');

        function enterFocus() { document.body.classList.add('searching'); }
        function exitFocus() {
            setTimeout(() => {
                if(strIn.value === "") document.body.classList.remove('searching');
            }, 200);
        }

        function handleSearch() {
            const zip = zipIn.value;
            const val = strIn.value.toLowerCase();
            sugBox.innerHTML = "";
            cardCont.innerHTML = "";
            if (!zip || val.length < 1) { sugBox.style.display = "none"; return; }

            let matches = (database[zip] || []).filter(s => s.name.toLowerCase().startsWith(val));
            matches.sort((a, b) => a.name.length - b.name.length || a.name.localeCompare(b.name));

            if (matches.length > 0) {
                sugBox.style.display = "block";
                matches.forEach(item => {
                    const div = document.createElement('div');
                    div.className = "suggestion-item";
                    div.innerText = item.name;
                    div.onclick = () => selectStreet(item);
                    sugBox.appendChild(div);
                });
            } else { sugBox.style.display = "none"; }
        }

        function selectStreet(item) {
            strIn.value = item.name;
            sugBox.style.display = "none";
            cardCont.innerHTML = "";
            item.results.forEach(res => {
                const card = document.createElement('div');
                card.className = "result-card";
                card.innerHTML = `
                    <div class="range-side"><div class="range-display">${res.range}</div></div>
                    <div class="route-side"><span class="lbl">ROUTE</span><span class="num">${res.route}</span></div>
                `;
                cardCont.appendChild(card);
            });
            document.activeElement.blur();
        }

        function clearStreetOnly() { 
            strIn.value = ""; sugBox.style.display = "none"; cardCont.innerHTML = ""; 
            document.body.classList.remove('searching');
            strIn.focus(); 
        }

        function fullAppReset() { 
            zipIn.selectedIndex = 0; clearStreetOnly(); 
            document.body.classList.remove('searching');
            window.scrollTo({ top: 0, behavior: 'smooth' }); 
        }
    </script>
</body>
</html>
