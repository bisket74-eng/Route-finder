<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vancouver Route Finder</title>
    <style>
        :root {
            --usps-blue: #004b87;
            --usps-red: #da291c;
            --usps-yellow: #ffde00;
            --scroll-blue: #82caff;
            --bg-color: #f4f7f9;
        }

        /* The whole page can scroll now to allow the header to move up */
        html, body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            -webkit-text-size-adjust: 100%;
        }

        /* HEADER (Not Sticky anymore so it can scroll away) */
        .header {
            background-color: var(--usps-blue);
            padding: 20px 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .usps-signature {
            color: white;
            font-size: 2rem;
            font-weight: 900;
            font-style: italic;
            letter-spacing: -3px;
            line-height: 0.8;
            font-family: "Arial Black", sans-serif;
            transform: skewX(-5deg);
            margin-bottom: 4px;
        }

        .vancouver-text {
            color: white;
            font-size: 1.5rem;
            font-weight: 900;
            text-transform: uppercase;
        }

        .route-finder-cool {
            margin-top: 2px;
            font-size: 0.9rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: var(--usps-yellow);
        }

        .header-accent {
            height: 6px;
            background-color: var(--usps-red);
            width: 100%;
        }

        /* SELECTORS (These will become sticky once they reach the top) */
        .sticky-controls {
            position: sticky;
            top: 0;
            z-index: 2000;
            background-color: var(--bg-color);
            padding: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .input-container {
            max-width: 450px;
            margin: 0 auto;
        }

        .input-row {
            display: flex;
            gap: 10px;
            align-items: flex-end;
            margin-bottom: 12px;
            position: relative;
        }

        .input-wrapper { flex: 1; position: relative; }

        label {
            display: block;
            margin-bottom: 3px;
            font-size: 0.75rem;
            font-weight: bold;
            color: #333;
            text-transform: uppercase;
        }

        select, input {
            width: 100%;
            padding: 12px;
            border: 2px solid #bbb;
            border-radius: 8px;
            font-size: 18px;
            box-sizing: border-box;
            background: white;
        }

        .btn-action {
            height: 48px;
            width: 90px;
            border-radius: 8px;
            border: none;
            font-weight: 900;
            font-size: 0.6rem;
            text-transform: uppercase;
            flex-shrink: 0;
        }

        .reset-all { background-color: var(--usps-red); color: white; }
        .reset-street { background-color: var(--usps-yellow); color: #000; }

        /* THE DROPDOWN LIST */
        .suggestion-box {
            background: white;
            border: 3px solid var(--usps-blue);
            border-radius: 12px;
            max-height: 350px; /* Taller now that header moves */
            overflow-y: scroll;
            display: none;
            position: absolute;
            top: 105%; 
            left: 0;
            right: 0;
            z-index: 5000;
            box-shadow: 0 8px 25px rgba(0,0,0,0.4);
        }

        .suggestion-box::-webkit-scrollbar { width: 14px; }
        .suggestion-box::-webkit-scrollbar-thumb {
            background: var(--scroll-blue);
            border: 2px solid #333;
            border-radius: 10px;
        }
        .suggestion-box::-webkit-scrollbar-track { background: #444; }

        .suggestion-item {
            padding: 18px 20px;
            border-bottom: 1px solid #eee;
            font-size: 1.2rem;
            font-weight: 800;
            color: var(--usps-blue);
        }

        /* Pushes the last items up so they don't hide behind keyboard */
        .kb-buffer { height: 100px; }

        #resultArea {
            padding: 10px 15px;
            max-width: 450px;
            margin: 0 auto;
        }

        .result-card {
            background: white;
            border-radius: 10px;
            padding: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #ccc;
        }

        .range-display { font-size: 1.4rem; font-weight: 900; color: #000; }
        .street-display { font-size: 0.85rem; color: #555; font-weight: 700; }

        .route-side {
            background-color: var(--usps-blue);
            color: white;
            padding: 8px;
            border-radius: 8px;
            text-align: center;
            min-width: 70px;
        }

        .route-side .lbl { font-size: 0.5rem; font-weight: bold; display: block; }
        .route-side .num { font-size: 1.4rem; font-weight: 900; display: block; }
    </style>
</head>
<body>

    <!-- This header scrolls away -->
    <div class="header">
        <span class="usps-signature">USPS</span>
        <div class="vancouver-text">VANCOUVER, WA</div>
        <div class="route-finder-cool">ROUTE FINDER</div>
    </div>
    <div class="header-accent"></div>

    <!-- These controls stick to the very top when you scroll down -->
    <div class="sticky-controls">
        <div class="input-container">
            <div class="input-row">
                <div class="input-wrapper">
                    <label>Zip Code</label>
                    <select id="zipCode" onchange="clearStreetOnly()">
                        <option value="">Select ZIP...</option>
                        <option value="98662">98662 (Demo)</option>
                        <option value="98661">98661</option>
                    </select>
                </div>
                <button class="btn-action reset-all" onclick="fullAppReset()">Reset<br>All</button>
            </div>

            <div class="input-row">
                <div class="input-wrapper">
                    <label>Street Name</label>
                    <input type="text" id="streetInput" placeholder="Type street name..." autocomplete="off" oninput="handleSearch()">
                    <div id="suggestionBox" class="suggestion-box"></div>
                </div>
                <button class="btn-action reset-street" onclick="clearStreetOnly()">Reset<br>Street</button>
            </div>
        </div>
    </div>

    <div id="resultArea"></div>

    <script>
        const database = {
            "98662": [
                { name: "18th Street", results: [{ range: "1000-1800", route: "C018" }] },
                { name: "180th Street", results: [{ range: "18000-18099", route: "C080" }] },
                { name: "181st Street", results: [{ range: "18100-18199", route: "C081" }] },
                { name: "182nd Street", results: [{ range: "18200-18299", route: "C082" }] },
                { name: "183rd Street", results: [{ range: "18300-18399", route: "C083" }] },
                { name: "184th Street", results: [{ range: "18400-18499", route: "C084" }] },
                { name: "185th Circle", results: [{ range: "18500-18599", route: "C085" }] },
                { name: "186th Avenue", results: [{ range: "18600-18699", route: "C086" }] },
                { name: "187th Avenue", results: [{ range: "18700-18799", route: "C087" }] },
                { name: "188th Street", results: [{ range: "18800-18899", route: "C088" }] },
                { name: "189th Street", results: [
                    { range: "100-998 (Even)", route: "C001" },
                    { range: "2501-3000", route: "C044" },
                    { range: "5001-6000", route: "C105" }
                ]}
            ]
        };

        const zipIn = document.getElementById('zipCode');
        const strIn = document.getElementById('streetInput');
        const sugBox = document.getElementById('suggestionBox');
        const resArea = document.getElementById('resultArea');

        function handleSearch() {
            const zip = zipIn.value;
            const val = strIn.value.toLowerCase();
            sugBox.innerHTML = "";
            resArea.innerHTML = "";
            if (!zip || val.length < 1) { sugBox.style.display = "none"; return; }

            // When user starts typing, scroll the page down slightly to hide the banner
            if (window.scrollY < 50) {
                window.scrollTo({ top: 100, behavior: 'smooth' });
            }

            let matches = (database[zip] || []).filter(s => s.name.toLowerCase().startsWith(val));
            matches.sort((a, b) => a.name.length - b.name.length || a.name.localeCompare(b.name));

            if (matches.length > 0) {
                sugBox.style.display = "block";
                matches.forEach(item => {
                    const div = document.createElement('div');
                    div.className = "suggestion-item";
                    div.innerText = item.name;
                    div.onclick = () => selectStreet(item);
                    sugBox.appendChild(div);
                });
                // Add keyboard buffer at the end of the list
                const buffer = document.createElement('div');
                buffer.className = "kb-buffer";
                sugBox.appendChild(buffer);
            } else { sugBox.style.display = "none"; }
        }

        function selectStreet(item) {
            strIn.value = item.name;
            sugBox.style.display = "none";
            resArea.innerHTML = "";
            item.results.forEach(res => {
                const card = document.createElement('div');
                card.className = "result-card";
                card.innerHTML = `
                    <div class="range-side">
                        <div class="range-display">${res.range}</div>
                        <div class="street-display">${item.name}</div>
                    </div>
                    <div class="route-side">
                        <span class="lbl">ROUTE</span>
                        <span class="num">${res.route}</span>
                    </div>
                `;
                resArea.appendChild(card);
            });
        }

        function clearStreetOnly() {
            strIn.value = "";
            sugBox.innerHTML = "";
            sugBox.style.display = "none";
            resArea.innerHTML = "";
            strIn.focus();
        }

        function fullAppReset() {
            zipIn.selectedIndex = 0;
            clearStreetOnly();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    </script>
</body>
</html>
