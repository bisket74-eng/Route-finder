<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vancouver Route Finder</title>
    <style>
        :root {
            --usps-blue: #004b87;
            --usps-red: #da291c;
            --usps-yellow: #ffde00;
            --scroll-blue: #82caff;
            --bg-color: #f4f7f9;
        }

        /* Prevent the whole screen from scrolling */
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden; 
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
        }

        /* FIXED TOP SECTION */
        .sticky-top {
            position: relative;
            z-index: 1000;
            background-color: var(--bg-color);
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .header {
            background-color: var(--usps-blue);
            padding: 25px 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .usps-signature {
            color: white;
            font-size: 3.2rem;
            font-weight: 900;
            font-style: italic;
            letter-spacing: -4px;
            line-height: 0.8;
            font-family: "Arial Black", sans-serif;
            transform: skewX(-5deg);
        }

        .header h1 {
            color: white;
            margin: 10px 0 0 0;
            font-size: 0.9rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .header-accent {
            height: 6px;
            background-color: var(--usps-red);
            width: 100%;
        }

        .input-container {
            padding: 15px;
            max-width: 450px;
            margin: 0 auto;
        }

        .input-row {
            display: flex;
            gap: 12px;
            align-items: flex-end;
            margin-bottom: 15px;
            position: relative;
        }

        .input-wrapper { flex: 1; position: relative; }

        label {
            display: block;
            margin-bottom: 4px;
            font-size: 0.8rem;
            font-weight: bold;
            color: #333;
            text-transform: uppercase;
        }

        select, input {
            width: 100%;
            padding: 14px;
            border: 2px solid #bbb;
            border-radius: 10px;
            font-size: 18px;
            box-sizing: border-box;
            background: white;
        }

        .btn-action {
            height: 52px;
            width: 95px;
            border-radius: 10px;
            border: none;
            font-weight: 900;
            font-size: 0.65rem;
            text-transform: uppercase;
        }

        .reset-all { background-color: var(--usps-red); color: white; }
        .reset-street { background-color: var(--usps-yellow); color: #000; }

        /* INTERNAL SCROLLING RESULT AREA */
        #resultArea {
            height: calc(100vh - 350px); /* Adjusts based on header/input height */
            overflow-y: auto;
            padding: 10px 15px 100px 15px; /* bottom padding so results aren't blocked by fingers */
            -webkit-overflow-scrolling: touch;
        }

        /* THE SUGGESTION BOX (Still floats above) */
        .suggestion-box {
            background: white;
            border: 3px solid var(--usps-blue);
            border-radius: 12px;
            max-height: 220px;
            overflow-y: scroll;
            display: none;
            position: absolute;
            bottom: 105%; 
            left: 0;
            right: 0;
            z-index: 5000;
            box-shadow: 0 -8px 20px rgba(0,0,0,0.3);
        }

        .suggestion-box::-webkit-scrollbar { width: 12px; }
        .suggestion-box::-webkit-scrollbar-thumb {
            background: var(--scroll-blue);
            border: 2px solid #333;
            border-radius: 10px;
        }
        .suggestion-box::-webkit-scrollbar-track { background: #444; }

        .suggestion-item {
            padding: 18px 20px;
            border-bottom: 1px solid #eee;
            font-size: 1.2rem;
            font-weight: 800;
            color: var(--usps-blue);
        }

        /* RESULT CARDS */
        .result-card {
            background: white;
            border-radius: 12px;
            padding: 18px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #ccc;
        }

        .range-display { font-size: 1.6rem; font-weight: 900; color: #000; }
        .street-display { font-size: 0.95rem; color: #555; font-weight: 700; }

        .route-side {
            background-color: var(--usps-blue);
            color: white;
            padding: 8px;
            border-radius: 8px;
            text-align: center;
            min-width: 75px;
        }

        .route-side .lbl { font-size: 0.55rem; font-weight: bold; display: block; }
        .route-side .num { font-size: 1.6rem; font-weight: 900; display: block; }
    </style>
</head>
<body>

    <div class="sticky-top">
        <div class="header">
            <span class="usps-signature">USPS</span>
            <h1>Vancouver Route Finder</h1>
        </div>
        <div class="header-accent"></div>

        <div class="input-container">
            <!-- ZIP ROW -->
            <div class="input-row">
                <div class="input-wrapper">
                    <label>Zip Code</label>
                    <select id="zipCode" onchange="clearStreetOnly()">
                        <option value="">Select ZIP...</option>
                        <option value="98662">98662 (Scroll Test)</option>
                    </select>
                </div>
                <button class="btn-action reset-all" onclick="fullAppReset()">Reset<br>All</button>
            </div>

            <!-- STREET ROW -->
            <div class="input-row">
                <div class="input-wrapper">
                    <label>Street Name</label>
                    <div id="suggestionBox" class="suggestion-box"></div>
                    <input type="text" id="streetInput" placeholder="Type street name..." autocomplete="off" oninput="handleSearch()">
                </div>
                <button class="btn-action reset-street" onclick="clearStreetOnly()">Reset<br>Street</button>
            </div>
        </div>
    </div>

    <!-- THIS AREA SCROLLS SEPARATELY -->
    <div id="resultArea"></div>

    <script>
        const database = {
            "98662": [
                { name: "18th Street", results: [{ range: "1000-1800", route: "C018" }] },
                { name: "189th Street", results: [
                    { range: "100-998 (Even)", route: "C001" },
                    { range: "101-999 (Odd)", route: "C002" },
                    { range: "1000-1998 (Even)", route: "C015" },
                    { range: "1001-1999 (Odd)", route: "C016" },
                    { range: "2000-2500", route: "C022" },
                    { range: "2501-3000", route: "C044" },
                    { range: "3001-4000", route: "C099" },
                    { range: "4001-5000", route: "C102" },
                    { range: "5001-6000", route: "C105" }
                ]}
            ]
        };

        const zipIn = document.getElementById('zipCode');
        const strIn = document.getElementById('streetInput');
        const sugBox = document.getElementById('suggestionBox');
        const resArea = document.getElementById('resultArea');

        function handleSearch() {
            const zip = zipIn.value;
            const val = strIn.value.toLowerCase();
            sugBox.innerHTML = "";
            resArea.innerHTML = "";
            if (!zip || val.length < 1) { sugBox.style.display = "none"; return; }

            let matches = (database[zip] || []).filter(s => s.name.toLowerCase().startsWith(val));
            matches.sort((a, b) => a.name.length - b.name.length || a.name.localeCompare(b.name));

            if (matches.length > 0) {
                sugBox.style.display = "block";
                matches.forEach(item => {
                    const div = document.createElement('div');
                    div.className = "suggestion-item";
                    div.innerText = item.name;
                    div.onclick = () => selectStreet(item);
                    sugBox.appendChild(div);
                });
            } else { sugBox.style.display = "none"; }
        }

        function selectStreet(item) {
            strIn.value = item.name;
            sugBox.style.display = "none";
            resArea.innerHTML = "";
            item.results.forEach(res => {
                const card = document.createElement('div');
                card.className = "result-card";
                card.innerHTML = `
                    <div class="range-side">
                        <div class="range-display">${res.range}</div>
                        <div class="street-display">${item.name}</div>
                    </div>
                    <div class="route-side">
                        <span class="lbl">ROUTE</span>
                        <span class="num">${res.route}</span>
                    </div>
                `;
                resArea.appendChild(card);
            });
        }

        function clearStreetOnly() {
            strIn.value = "";
            sugBox.innerHTML = "";
            sugBox.style.display = "none";
            resArea.innerHTML = "";
            strIn.focus();
        }

        function fullAppReset() {
            zipIn.selectedIndex = 0;
            clearStreetOnly();
        }
    </script>
</body>
</html>
