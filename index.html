<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vancouver Route Finder</title>
    <style>
        :root {
            --usps-blue: #004b87;
            --usps-red: #da291c;
            --usps-yellow: #ffde00;
            --scroll-blue: #82caff;
            --bg-color: #f4f7f9;
        }

        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden; 
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
        }

        .sticky-top {
            position: relative;
            z-index: 1000;
            background-color: var(--bg-color);
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .header {
            background-color: var(--usps-blue);
            padding: 18px 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .usps-signature {
            color: white;
            font-size: 2rem;
            font-weight: 900;
            font-style: italic;
            letter-spacing: -3px;
            line-height: 0.8;
            font-family: "Arial Black", sans-serif;
            transform: skewX(-5deg);
            margin-bottom: 4px;
        }

        .vancouver-text {
            color: white;
            font-size: 1.5rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .route-finder-cool {
            margin-top: 2px;
            font-size: 0.9rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: var(--usps-yellow);
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
        }

        .header-accent {
            height: 6px;
            background-color: var(--usps-red);
            width: 100%;
        }

        .input-container {
            padding: 12px;
            max-width: 450px;
            margin: 0 auto;
        }

        .input-row {
            display: flex;
            gap: 10px;
            align-items: flex-end;
            margin-bottom: 12px;
            position: relative;
        }

        .input-wrapper { flex: 1; position: relative; }

        label {
            display: block;
            margin-bottom: 3px;
            font-size: 0.75rem;
            font-weight: bold;
            color: #333;
            text-transform: uppercase;
        }

        select, input {
            width: 100%;
            padding: 12px;
            border: 2px solid #bbb;
            border-radius: 8px;
            font-size: 18px;
            box-sizing: border-box;
            background: white;
        }

        .btn-action {
            height: 48px;
            width: 90px;
            border-radius: 8px;
            border: none;
            font-weight: 900;
            font-size: 0.6rem;
            text-transform: uppercase;
        }

        .reset-all { background-color: var(--usps-red); color: white; }
        .reset-street { background-color: var(--usps-yellow); color: #000; }

        #resultArea {
            height: calc(100vh - 320px); 
            overflow-y: auto;
            padding: 10px 15px;
            -webkit-overflow-scrolling: touch;
        }

        .scroll-spacer {
            height: 80px; 
            width: 100%;
        }

        .suggestion-box {
            background: white;
            border: 3px solid var(--usps-blue);
            border-radius: 12px;
            max-height: 235px; 
            overflow-y: scroll;
            display: none;
            position: absolute;
            bottom: 105%; 
            left: 0;
            right: 0;
            z-index: 5000;
            box-shadow: 0 -8px 20px rgba(0,0,0,0.3);
        }

        .suggestion-box::-webkit-scrollbar { width: 12px; }
        .suggestion-box::-webkit-scrollbar-thumb {
            background: var(--scroll-blue);
            border: 2px solid #333;
            border-radius: 10px;
        }
        .suggestion-box::-webkit-scrollbar-track { background: #444; }

        .suggestion-item {
            padding: 18px 20px;
            border-bottom: 1px solid #eee;
            font-size: 1.2rem;
            font-weight: 800;
            color: var(--usps-blue);
        }

        .result-card {
            background: white;
            border-radius: 10px;
            padding: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #ccc;
        }

        .range-display { font-size: 1.4rem; font-weight: 900; color: #000; }
        .street-display { font-size: 0.85rem; color: #555; font-weight: 700; }

        .route-side {
            background-color: var(--usps-blue);
            color: white;
            padding: 8px;
            border-radius: 8px;
            text-align: center;
            min-width: 70px;
        }

        .route-side .lbl { font-size: 0.55rem; font-weight: bold; display: block; }
        .route-side .num { font-size: 1.4rem; font-weight: 900; display: block; }
    </style>
</head>
<body>

    <div class="sticky-top">
        <div class="header">
            <span class="usps-signature">USPS</span>
            <div class="vancouver-text">VANCOUVER, WA</div>
            <div class="route-finder-cool">ROUTE FINDER</div>
        </div>
        <div class="header-accent"></div>

        <div class="input-container">
            <div class="input-row">
                <div class="input-wrapper">
                    <label>Zip Code</label>
                    <select id="zipCode" onchange="clearStreetOnly()">
                        <option value="">Select ZIP...</option>
                        <option value="98660">98660</option>
                        <option value="98661">98661</option>
                        <option value="98662">98662 (Demo Data)</option>
                        <option value="98663">98663</option>
                        <option value="98664">98664</option>
                        <option value="98665">98665</option>
                        <option value="98668">98668</option>
                        <option value="98682">98682</option>
                        <option value="98683">98683</option>
                        <option value="98684">98684</option>
                        <option value="98685">98685</option>
                        <option value="98686">98686</option>
                    </select>
                </div>
                <button class="btn-action reset-all" onclick="fullAppReset()">Reset<br>All</button>
            </div>

            <div class="input-row">
                <div class="input-wrapper">
                    <label>Street Name</label>
                    <div id="suggestionBox" class="suggestion-box"></div>
                    <input type="text" id="streetInput" placeholder="Start typing street..." autocomplete="off" oninput="handleSearch()">
                </div>
                <button class="btn-action reset-street" onclick="clearStreetOnly()">Reset<br>Street</button>
            </div>
        </div>
    </div>

    <div id="resultArea">
        <div id="cardContainer"></div>
        <div class="scroll-spacer"></div>
    </div>

    <script>
        const database = {
            "98662": [
                { name: "1st Street", results: [{ range: "100 - 998", route: "C001" }] },
                { name: "18th Circle", results: [{ range: "1800 - 1899", route: "C018" }] },
                { name: "187th Avenue", results: [
                    { range: "101 - 899 (Odd)", route: "C042" },
                    { range: "102 - 898 (Even)", route: "C043" }
                ]},
                { name: "188th Street", results: [
                    { range: "1000 - 1500", route: "C050" },
                    { range: "1501 - 2200", route: "C051" }
                ]},
                { name: "189th Street", results: [
                    { range: "100-998 (Even)", route: "C001" },
                    { range: "101-999 (Odd)", route: "C002" },
                    { range: "1000-1998 (Even)", route: "C015" },
                    { range: "1001-1999 (Odd)", route: "C016" },
                    { range: "2000-2500", route: "C022" },
                    { range: "2501-3000", route: "C044" },
                    { range: "3001-4000", route: "C099" },
                    { range: "4001-5000", route: "C102" },
                    { range: "5001-6000", route: "C105" }
                ]}
            ]
        };

        const zipIn = document.getElementById('zipCode');
        const strIn = document.getElementById('streetInput');
        const sugBox = document.getElementById('suggestionBox');
        const cardCont = document.getElementById('cardContainer');

        function handleSearch() {
            const zip = zipIn.value;
            const val = strIn.value.toLowerCase();
            sugBox.innerHTML = "";
            cardCont.innerHTML = "";
            if (!zip || val.length < 1) { sugBox.style.display = "none"; return; }

            let matches = (database[zip] || []).filter(s => s.name.toLowerCase().startsWith(val));
            matches.sort((a, b) => a.name.length - b.name.length || a.name.localeCompare(b.name));

            if (matches.length > 0) {
                sugBox.style.display = "block";
                matches.forEach(item => {
                    const div = document.createElement('div');
                    div.className = "suggestion-item";
                    div.innerText = item.name;
                    div.onclick = () => selectStreet(item);
                    sugBox.appendChild(div);
                });
            } else { sugBox.style.display = "none"; }
        }

        function selectStreet(item) {
            strIn.value = item.name;
            sugBox.style.display = "none";
            cardCont.innerHTML = "";
            item.results.forEach(res => {
                const card = document.createElement('div');
                card.className = "result-card";
                card.innerHTML = `
                    <div class="range-side">
                        <div class="range-display">${res.range}</div>
                        <div class="street-display">${item.name}</div>
                    </div>
                    <div class="route-side">
                        <span class="lbl">ROUTE</span>
                        <span class="num">${res.route}</span>
                    </div>
                `;
                cardCont.appendChild(card);
            });
        }

        function clearStreetOnly() {
            strIn.value = "";
            sugBox.innerHTML = "";
            sugBox.style.display = "none";
            cardCont.innerHTML = "";
            strIn.focus();
        }

        function fullAppReset() {
            zipIn.selectedIndex = 0;
            clearStreetOnly();
        }
    </script>
</body>
</html>
