<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>USPS Fast-Sort Pro</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        :root { --bl: #004b87; --rd: #da291c; --yl: #ffde00; --bg: #f4f7f9; }
        .sticky-top { position: sticky; top: 0; z-index: 2000; background: var(--bg); }
        body { margin: 0; background: var(--bg); font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; overflow-x: hidden; }
        
        /* OFFICIAL HEADER */
        .hdr { background: var(--bl); padding: 18px 15px; text-align: center; color: white; cursor: pointer; }
        .usps-sig { font-size: 2.4rem; font-weight: 900; font-style: italic; letter-spacing: -3px; transform: skewX(-12deg); display: block; line-height: 0.8; margin-bottom: 5px; }
        .vanc-text { font-size: 1.4rem; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; display: block; }
        .rt-finder-text { font-size: 0.8rem; font-weight: 700; text-transform: uppercase; letter-spacing: 4px; color: var(--yl); margin-top: 4px; display: block; }
        .hdr-accent { height: 5px; background: var(--rd); width: 100%; }
        
        #admin { display: none; background: white; padding: 15px; position: absolute; z-index: 20000; top: 10px; left: 10px; right: 10px; border-radius: 12px; border: 3px dashed var(--bl); box-shadow: 0 10px 30px #000; }
        textarea { width: 100%; height: 150px; font-size: 12px; }

        .ctrls { padding: 10px; background: white; box-shadow: 0 2px 5px rgba(0,0,0,0.1); position: relative; }
        .row { display: flex; gap: 8px; margin-bottom: 8px; align-items: flex-end; }
        select, input { width: 100%; padding: 12px; border: 2px solid #bbb; border-radius: 8px; font-size: 18px; box-sizing: border-box; font-weight: 600; }
        
        .btn { height: 48px; border-radius: 8px; border: none; font-weight: 900; text-transform: uppercase; cursor: pointer; font-size: 0.7rem; }
        .red { background: var(--rd); color: white; width: 85px; }
        .yel { background: var(--yl); color: black; width: 85px; }
        
        /* PICK LIST (DROPS DOWN) */
        .sug { background: white; border: 3px solid var(--bl); max-height: 250px; overflow-y: auto; display: none; position: absolute; top: 100%; left: 0; right: 0; z-index: 9999; box-shadow: 0 15px 35px rgba(0,0,0,0.4); border-radius: 0 0 12px 12px; }
        .s-item { padding: 15px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; font-weight: 900; color: var(--bl); }

        #flash-res { position: fixed; top: 20%; left: 8%; right: 8%; z-index: 12000; display: none; transform: scale(0.5); opacity: 0; transition: 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        #flash-res.show { display: block; transform: scale(1); opacity: 1; }
        .big-card { background: white; border: 6px solid var(--bl); border-radius: 24px; padding: 30px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); text-align: center; }
        .rt-giant { font-size: 8rem; font-weight: 900; color: var(--bl); line-height: 1; display: block; }

        #list-res { flex: 1; overflow-y: auto; padding: 15px; }
        .list-card { background: white; padding: 15px; margin-bottom: 12px; border-radius: 12px; border: 1px solid #ccc; display: flex; justify-content: space-between; align-items: center; }
        .blue-block { background: var(--bl); color: white; padding: 10px; border-radius: 8px; text-align: center; min-width: 75px; font-weight: 900; }
        .blue-block small { font-size: 0.6rem; display: block; margin-bottom: -3px; }
        .blue-block span { font-size: 1.6rem; display: block; }

        /* THE RETURN BUTTON */
        #return-btn { display: none; width: 100%; padding: 16px; background: var(--bl); color: white; border: none; font-weight: 900; border-radius: 8px; margin-bottom: 15px; text-transform: uppercase; font-size: 1rem; }

        .scan-wrap { padding: 20px; background: white; border-top: 1px solid #ddd; flex-shrink: 0; }
        .big-scan { background: var(--bl); color: white; width: 100%; padding: 20px; border-radius: 50px; font-size: 1.3rem; font-weight: 900; border: none; text-transform: uppercase; }

        #scanner-ui { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: black; z-index: 11000; }
        #reader { width: 100%; height: 80%; }
        .scan-close { position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%); padding: 15px 40px; background: var(--rd); color: white; border-radius: 50px; border: none; font-weight: 900; }
    </style>
</head>
<body>
    <div id="admin">
        <textarea id="ti" placeholder="Paste Row 3 down..."></textarea>
        <button onclick="sd()" style="width:100%; padding:15px; background:var(--bl); color:white; border:none; font-weight:bold; border-radius:8px;">SAVE DATA</button>
    </div>

    <div id="scanner-ui"><div id="reader"></div><button class="scan-close" onclick="stopScan()">CANCEL</button></div>

    <div id="flash-res">
        <div class="big-card">
            <span id="f-zip" style="font-weight:900; color:var(--bl); font-size:1.4rem;"></span>
            <span id="f-rt" class="rt-giant"></span>
            <span id="f-st" style="text-transform:uppercase; font-size:1.1rem; font-weight:800; color:#444;"></span>
        </div>
    </div>

    <div class="sticky-top">
        <div class="hdr" onclick="kn()">
            <span class="usps-sig">USPS</span>
            <span class="vanc-text">Vancouver, WA</span>
            <span class="rt-finder-text">Route Finder</span>
        </div>
        <div class="hdr-accent"></div>

        <div class="ctrls">
            <div class="row">
                <select id="zs" onchange="zipChanged()">
                    <option value="">Select ZIP...</option>
                    <option value="ALL">ALL ZIPs</option>
                    <option value="98660">98660</option><option value="98661">98661</option><option value="98662">98662</option>
                    <option value="98663">98663</option><option value="98664">98664</option><option value="98665">98665</option>
                    <option value="98668">98668</option><option value="98682">98682</option><option value="98683">98683</option>
                    <option value="98684">98684</option><option value="98685">98685</option><option value="98686">98686</option>
                </select>
                <button class="btn red" onclick="resetAll()">Reset</button>
            </div>
            <div class="row" style="position:relative">
                <input type="text" id="si" placeholder="Select ZIP first..." disabled oninput="searchStreets()">
                <div id="sb" class="sug"></div>
                <button class="btn yel" onclick="clearSearchOnly()">Clear</button>
            </div>
        </div>
    </div>

    <div id="list-res">
        <button id="return-btn" onclick="backToStreetList()">Return to Street List</button>
        <div id="cc"></div>
    </div>

    <div class="scan-wrap">
        <button class="big-scan" onclick="startScan()">📷 SCAN PACKAGE</button>
    </div>

<script>
    let d = {}; const zs=document.getElementById('zs'), si=document.getElementById('si'), sb=document.getElementById('sb'), cc=document.getElementById('cc'), rbtn=document.getElementById('return-btn');
    let scanner = null, fullList = [];

    window.onload = () => { 
        const s = localStorage.getItem('vanc_db'); 
        if(s) {
            d = JSON.parse(s);
            Object.keys(d).forEach(z => d[z].forEach(st => st.list.forEach(r => fullList.push({ z:z, n:st.name, r:r.range, rt:r.rt }))));
        }
    };

    function kn(){ window.k=(window.k||0)+1; setTimeout(()=>window.k=0,1500); if(window.k===5)document.getElementById('admin').style.display='block'; }
    
    function sd(){
        const l=document.getElementById('ti').value.split('\n'), n={};
        l.forEach(x=>{ const c=x.split('\t'); if(c.length < 8) return; 
            const z=c[7]?.trim(), nm=c[4]?.trim(); if(!z||!nm) return; if(!n[z]) n[z]=[];
            const f=[c[3],c[4],c[5],c[6]].filter(Boolean).map(y=>y.trim()).join(" ");
            let s=n[z].find(y=>y.name===f); if(!s){ s={name:f, key:nm.toUpperCase(), list:[]}; n[z].push(s); }
            s.list.push({range:c[0]+(c[1]?"-"+c[1]:""), rt:c[8]?.trim()||"??"});
        });
        localStorage.setItem('vanc_db', JSON.stringify(n)); alert("Data Saved!"); location.reload();
    }

    // MANDATORY ZIP SELECTION LOGIC
    function zipChanged(){
        si.value = "";
        sb.innerHTML = "";
        sb.style.display = "none";
        cc.innerHTML = "";
        rbtn.style.display = "none";

        if(zs.value !== ""){
            si.disabled = false;
            si.placeholder = "Type street name...";
            si.focus();
        } else {
            si.disabled = true;
            si.placeholder = "Select ZIP first...";
        }
    }

    function searchStreets(){
        const v=si.value.toUpperCase().trim(); cc.innerHTML=""; sb.innerHTML=""; rbtn.style.display="none"; 
        if(!v){ sb.style.display="none"; return; }
        let f=[]; const t=(zs.value==="ALL")?Object.keys(d):[zs.value];
        t.forEach(z=>{ if(d[z]) d[z].filter(s=>s.key.startsWith(v)).forEach(s=>f.push({...s, zip:z})); });
        if(f.length>0){ 
            sb.style.display="block"; 
            f.sort((a,b)=>a.name.localeCompare(b.name)).forEach(x=>{
                const div = document.createElement('div'); div.className="s-item";
                div.innerHTML=`<span>${x.name}</span> <small style="background:var(--bl); color:white; padding:2px 6px; border-radius:4px;">${x.zip}</small>`; 
                div.onclick = () => selectStreet(x); 
                sb.appendChild(div);
            }); 
        } else { sb.style.display="none"; }
    }

    function selectStreet(x){
        si.value = x.name; 
        sb.style.display = "none"; 
        cc.innerHTML = ""; 
        rbtn.style.display = "block";
        x.list.forEach(i => {
            const div = document.createElement('div'); div.className="list-card";
            div.innerHTML=`<div class="blue-block"><small>ZIP</small><span>${x.zip}</span></div><div style="flex:1; padding:0 15px;"><b style="font-size:1.7rem">${i.range}</b><br><small style="font-weight:bold; color:#555">${x.name}</small></div><div class="blue-block"><small>RT</small><span>${i.rt}</span></div>`;
            cc.appendChild(div);
        });
        window.scrollTo(0,0);
    }

    // FIXED: Returns to street list WITHOUT resetting ZIP or Input
    function backToStreetList() {
        cc.innerHTML = "";
        rbtn.style.display = "none";
        searchStreets(); // Re-opens the pick list based on what's in the text box
    }

    function clearSearchOnly() {
        si.value = "";
        sb.innerHTML = "";
        sb.style.display = "none";
        cc.innerHTML = "";
        rbtn.style.display = "none";
        if(!si.disabled) si.focus();
    }

    function resetAll(){ 
        zs.selectedIndex = 0; 
        zipChanged(); 
    }

    function startScan() {
        if (fullList.length === 0) { flashCard("98661", "C042", "NO DATA"); return; }
        document.getElementById('scanner-ui').style.display = 'block';
        scanner = new Html5Qrcode("reader");
        scanner.start({ facingMode: "environment" }, { fps: 20, qrbox: { width: 350, height: 150 } }, (txt) => {
            stopScan(); processScan(txt.trim());
        }).catch(err => { alert("Camera error"); stopScan(); });
    }

    function processScan(raw) {
        const zip = raw.slice(-11, -6), dp = raw.slice(-2);
        let match = fullList.find(i => i.z === zip && i.r.includes(dp));
        if (match) { flashCard(match.z, match.rt, match.n); } 
        else { alert("ZIP " + zip + " found."); zs.value = zip; zipChanged(); }
    }

    function flashCard(zip, route, street) {
        const flash = document.getElementById('flash-res');
        document.getElementById('f-zip').innerText = "ZIP: " + zip;
        document.getElementById('f-rt').innerText = route;
        document.getElementById('f-st').innerText = street;
        flash.style.display = 'block';
        setTimeout(() => flash.classList.add('show'), 10);
        setTimeout(() => { flash.classList.remove('show'); setTimeout(() => flash.style.display = 'none', 300); }, 2000);
    }

    function stopScan() { if(scanner) scanner.stop(); document.getElementById('scanner-ui').style.display = 'none'; }
</script>
</body>
</html>
