<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>USPS Route Finder</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        :root { --bl: #004b87; --rd: #da291c; --yl: #ffde00; --bg: #f4f7f9; }
        body { margin: 0; background: var(--bg); font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        /* SLIM HEADER */
        .hdr { background: var(--bl); padding: 10px 15px; text-align: center; color: white; cursor: pointer; flex-shrink: 0; }
        .usps-sig { font-size: 1.8rem; font-weight: 900; font-style: italic; letter-spacing: -2px; transform: skewX(-12deg); display: block; line-height: 1; }
        .vanc-text { font-size: 1.1rem; font-weight: 800; text-transform: uppercase; display: block; }
        .hdr-accent { height: 4px; background: var(--rd); width: 100%; flex-shrink: 0; }
        
        #admin { display: none; background: white; padding: 15px; position: absolute; z-index: 10000; top: 10px; left: 10px; right: 10px; border: 2px solid var(--bl); border-radius: 8px; }
        textarea { width: 100%; height: 120px; font-size: 12px; }

        .ctrls { padding: 8px; background: white; box-shadow: 0 2px 5px rgba(0,0,0,0.1); z-index: 50; }
        .row { display: flex; gap: 6px; margin-bottom: 6px; align-items: flex-end; }
        select, input { width: 100%; padding: 10px; border: 2px solid #bbb; border-radius: 8px; font-size: 16px; box-sizing: border-box; font-weight: 600; }
        
        .btn { height: 44px; border-radius: 8px; border: none; font-weight: 900; text-transform: uppercase; cursor: pointer; font-size: 0.65rem; }
        .red { background: var(--rd); color: white; width: 70px; }
        .yel { background: var(--yl); color: black; width: 80px; }
        
        /* FLY-IN RESULT */
        #flash-res { position: fixed; top: 15%; left: 10%; right: 10%; z-index: 12000; display: none; transform: scale(0.8); opacity: 0; transition: 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.2); }
        #flash-res.show { display: block; transform: scale(1); opacity: 1; }
        .big-card { background: white; border: 6px solid var(--bl); border-radius: 20px; padding: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.5); text-align: center; }
        .rt-giant { font-size: 7rem; font-weight: 900; color: var(--bl); line-height: 1; display: block; }

        /* LIST RESULTS */
        #list-res { flex: 1; overflow-y: auto; padding: 10px; position: relative; }
        .list-card { background: white; padding: 12px; margin-bottom: 10px; border-radius: 10px; border: 1px solid #ccc; display: flex; justify-content: space-between; align-items: center; }
        .blue-block { background: var(--bl); color: white; padding: 8px; border-radius: 6px; text-align: center; min-width: 65px; font-weight: 900; }
        .blue-block small { font-size: 0.5rem; display: block; margin-bottom: -2px; }
        .blue-block span { font-size: 1.4rem; }

        /* BUTTON PLACEMENT */
        .scan-wrap { padding: 15px; display: flex; justify-content: center; background: white; border-top: 1px solid #eee; }
        .big-scan { background: var(--bl); color: white; width: 80%; padding: 16px; border-radius: 50px; font-size: 1.1rem; font-weight: 900; border: none; }
        
        #return-btn { display: none; width: 100%; padding: 12px; background: var(--bl); color: white; border: none; font-weight: 900; border-radius: 8px; margin-bottom: 10px; }
        .sug { background: white; border: 2px solid var(--bl); max-height: 200px; overflow-y: auto; display: none; position: absolute; width: calc(100% - 20px); z-index: 100; }

        #scanner-ui { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: black; z-index: 11000; }
        #reader { width: 100%; height: 75%; }
        .scan-close { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); padding: 15px 30px; background: var(--rd); color: white; border-radius: 50px; font-weight: 900; border: none; }
    </style>
</head>
<body>
    <div id="admin">
        <textarea id="ti" placeholder="Paste Row 3 down..."></textarea>
        <button onclick="sd()" style="width:100%; padding:10px; background:var(--bl); color:white; border:none; font-weight:bold;">SAVE DATA</button>
    </div>

    <div id="scanner-ui"><div id="reader"></div><button class="scan-close" onclick="stopScan()">CANCEL</button></div>

    <div id="flash-res">
        <div class="big-card">
            <span id="f-zip" style="font-weight:900; color:var(--bl)"></span>
            <span id="f-rt" class="rt-giant"></span>
            <span id="f-st" style="text-transform:uppercase; font-size:0.9rem; font-weight:bold"></span>
        </div>
    </div>

    <div class="hdr" onclick="kn()">
        <span class="usps-sig">USPS</span>
        <span class="vanc-text">Vancouver, WA</span>
    </div>
    <div class="hdr-accent"></div>

    <div class="ctrls">
        <div class="row">
            <select id="zs" onchange="zc()">
                <option value="">Select ZIP...</option><option value="ALL">ALL ZIPs</option>
                <option value="98660">98660</option><option value="98661">98661</option><option value="98662">98662</option>
                <option value="98684">98684</option><option value="98685">98685</option>
            </select>
            <button class="btn red" onclick="ra()">Reset</button>
        </div>
        <div class="row" style="position:relative">
            <input type="text" id="si" placeholder="Select ZIP first..." disabled oninput="sh()">
            <div id="sb" class="sug"></div>
            <button class="btn yel" onclick="cs()">Clear</button>
        </div>
    </div>

    <div id="list-res">
        <button id="return-btn" onclick="cs()">Return to Street List</button>
        <div id="cc"></div>
    </div>

    <div class="scan-wrap">
        <button class="big-scan" onclick="startScan()">📷 SCAN PACKAGE</button>
    </div>

<script>
    let d = {}; const zs=document.getElementById('zs'), si=document.getElementById('si'), sb=document.getElementById('sb'), cc=document.getElementById('cc'), rbtn=document.getElementById('return-btn');
    let scanner = null, fullList = [];

    window.onload = () => { 
        const s = localStorage.getItem('vanc_db'); 
        if(s) {
            d = JSON.parse(s);
            Object.keys(d).forEach(z => d[z].forEach(st => st.list.forEach(r => fullList.push({ z:z, n:st.name, r:r.range, rt:r.rt }))));
        }
    };

    function kn(){ window.k=(window.k||0)+1; setTimeout(()=>window.k=0,1500); if(window.k===5)document.getElementById('admin').style.display='block'; }
    
    function sd(){
        const l=document.getElementById('ti').value.split('\n'), n={};
        l.forEach(x=>{ const c=x.split('\t'); if(c.length < 8)return; 
            const z=c[7]?.trim(), nm=c[4]?.trim(); if(!z||!nm)return; if(!n[z])n[z]=[];
            const f=[c[3],c[4],c[5],c[6]].filter(Boolean).map(y=>y.trim()).join(" ");
            let s=n[z].find(y=>y.name===f); if(!s){ s={name:f, key:nm.toUpperCase(), list:[]}; n[z].push(s); }
            s.list.push({range:c[0]+(c[1]?"-"+c[1]:""), rt:c[8]?.trim()||"??"});
        });
        localStorage.setItem('vanc_db', JSON.stringify(n)); alert("Saved!"); location.reload();
    }

    function zc(){ cs(); if(zs.value){si.disabled=false;si.placeholder="Type street...";} else {si.disabled=true;} }

    function sh(){
        const v=si.value.toUpperCase().trim(); cc.innerHTML=""; sb.innerHTML=""; rbtn.style.display="none"; if(!v){sb.style.display="none";return;}
        let f=[]; const t=(zs.value==="ALL")?Object.keys(d):[zs.value];
        t.forEach(z=>{ if(d[z]) d[z].filter(s=>s.key.startsWith(v)).forEach(s=>f.push({...s, zip:z})); });
        if(f.length>0){ sb.style.display="block"; f.sort((a,b)=>a.name.localeCompare(b.name)).forEach(x=>{
            const div = document.createElement('div'); div.style.padding="12px"; div.style.borderBottom="1px solid #eee"; div.style.fontWeight="900"; div.style.color="var(--bl)";
            div.innerHTML=`${x.name} <small style="float:right">${x.zip}</small>`; div.onclick=()=>sr(x); sb.appendChild(div);
        }); } else { sb.style.display="none"; }
    }

    function sr(x){
        si.value = x.name; sb.style.display = "none"; cc.innerHTML = ""; rbtn.style.display = "block";
        x.list.forEach(i => {
            const div = document.createElement('div'); div.className="list-card";
            div.innerHTML=`<div class="blue-block"><small>ZIP</small><span>${x.zip}</span></div><div style="flex:1; padding-left:15px;"><b style="font-size:1.4rem">${i.range}</b><br><small style="font-weight:bold">${x.name}</small></div><div class="blue-block"><small>RT</small><span>${i.rt}</span></div>`;
            cc.appendChild(div);
        });
        window.scrollTo(0,0);
    }

    function startScan() {
        if (fullList.length === 0) { flashCard("98661", "C042", "NO DATA LOADED"); return; }
        document.getElementById('scanner-ui').style.display = 'block';
        scanner = new Html5Qrcode("reader");
        scanner.start({ facingMode: "environment" }, { fps: 20, qrbox: { width: 320, height: 150 } }, (txt) => {
            stopScan(); processScan(txt.trim());
        }).catch(err => { alert("Camera error"); stopScan(); });
    }

    function processScan(raw) {
        const zip = raw.slice(-11, -6), dp = raw.slice(-2);
        let match = fullList.find(i => i.z === zip && i.r.includes(dp));
        if (match) { flashCard(match.z, match.rt, match.n); } 
        else { alert("ZIP " + zip + " found. Check list."); zs.value = zip; zc(); }
    }

    function flashCard(zip, route, street) {
        const flash = document.getElementById('flash-res');
        document.getElementById('f-zip').innerText = "ZIP: " + zip;
        document.getElementById('f-rt').innerText = route;
        document.getElementById('f-st').innerText = street;
        flash.style.display = 'block';
        setTimeout(() => flash.classList.add('show'), 10);
        setTimeout(() => { flash.classList.remove('show'); setTimeout(() => flash.style.display = 'none', 300); }, 2000);
    }

    function stopScan() { if(scanner) scanner.stop(); document.getElementById('scanner-ui').style.display = 'none'; }
    function cs(){ si.value=""; sb.style.display="none"; cc.innerHTML=""; rbtn.style.display="none"; if(!si.disabled)si.focus(); }
    function ra(){ zs.selectedIndex=0; zc(); }
</script>
</body>
</html>
