<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vancouver Route Filter</title>
    <style>
        :root { --usps-blue: #004b87; --usps-red: #da291c; }
        body { font-family: sans-serif; margin: 0; padding: 15px; background: #f0f2f5; }
        .app-card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); max-width: 400px; margin: auto; }
        h2 { color: var(--usps-blue); margin-top: 0; border-bottom: 2px solid var(--usps-red); padding-bottom: 8px; }
        label { display: block; margin: 15px 0 5px; font-weight: bold; font-size: 0.8em; color: #666; }
        select, input { 
            width: 100%; padding: 14px; border: 2px solid #ddd; border-radius: 8px; 
            font-size: 16px; box-sizing: border-box; 
        }
        .btn-reset { 
            width: 100%; background: #444; color: white; border: none; padding: 12px; 
            border-radius: 8px; margin-top: 20px; font-weight: bold;
        }
        .result-item { 
            margin-top: 15px; padding: 15px; background: #eef2f7; 
            border-radius: 8px; border-left: 5px solid var(--usps-blue);
        }
        .route-num { font-size: 1.5em; font-weight: bold; color: var(--usps-blue); }
    </style>
</head>
<body>

<div class="app-card">
    <h2>Route Filter</h2>

    <label>1. SELECT ZIP CODE</label>
    <select id="zipCode" onchange="initStreetList()">
        <option value="">-- Select --</option>
        <option value="98660">98660</option>
        <option value="98661">98661</option>
        <option value="98662">98662</option>
        <option value="98663">98663</option>
        <option value="98664">98664</option>
        <option value="98665">98665</option>
    </select>

    <label>2. STREET NAME</label>
    <!-- The 'list' attribute connects to the datalist ID below -->
    <input list="streetOptions" id="streetInput" placeholder="Type street name..." oninput="checkMatch()">
    <datalist id="streetOptions"></datalist>

    <div id="resultArea"></div>

    <button class="btn-reset" onclick="resetApp()">RESET</button>
</div>

<script>
    // EXPANDED DATA EXAMPLE
    const cityData = {
        "98660": [
            { name: "86th Avenue", range: "100-900", route: "C012" },
            { name: "Columbia St", range: "100-1500", route: "C001" },
            { name: "Washington St", range: "500-2000", route: "C005" }
        ],
        "98661": [
            { name: "86th Street", range: "500-1200", route: "C025" },
            { name: "Mill Plain Blvd", range: "100-5000", route: "C010" },
            { name: "Fourth Plain Blvd", range: "200-4500", route: "C015" }
        ],
        "98662": [
            { name: "NE 76th St", range: "1000-5000", route: "C044" },
            { name: "NE Vancouver Mall Dr", range: "8000-9500", route: "C045" }
        ]
    };

    const zipSelect = document.getElementById('zipCode');
    const streetInput = document.getElementById('streetInput');
    const streetOptions = document.getElementById('streetOptions');
    const resultArea = document.getElementById('resultArea');

    function initStreetList() {
        const zip = zipSelect.value;
        streetOptions.innerHTML = ""; 
        streetInput.value = "";
        resultArea.innerHTML = "";

        if (cityData[zip]) {
            cityData[zip].forEach(item => {
                let opt = document.createElement('option');
                opt.value = item.name;
                streetOptions.appendChild(opt);
            });
        }
    }

    function checkMatch() {
        const zip = zipSelect.value;
        const val = streetInput.value;
        if (!cityData[zip]) return;

        // Search for the street in our data
        const match = cityData[zip].find(s => s.name.toLowerCase() === val.toLowerCase());
        
        if (match) {
            resultArea.innerHTML = `
                <div class="result-item">
                    <div style="font-size: 0.8em; color: #666;">CARRIER ROUTE</div>
                    <div class="route-num">${match.route}</div>
                    <hr border="0" style="border-top:1px solid #ccc; margin: 10px 0;">
                    <strong>${match.name}</strong><br>
                    Range: ${match.range}
                </div>`;
        } else {
            resultArea.innerHTML = "";
        }
    }

    function resetApp() {
        location.reload(); // Hard reset for simplicity
    }
</script>

</body>
</html>
