<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>USPS Persistence Pro</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        :root { --bl: #004b87; --rd: #da291c; --yl: #ffde00; --bg: #f4f7f9; }
        
        /* SHARP SCROLLBARS */
        ::-webkit-scrollbar { width: 14px; }
        ::-webkit-scrollbar-track { background: #eee; }
        ::-webkit-scrollbar-thumb { background: var(--bl); border-radius: 10px; border: 3px solid #eee; }

        body { margin: 0; background: var(--bg); font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        /* HEADER SECTION */
        .sticky-top { position: sticky; top: 0; z-index: 5000; background: var(--bg); flex-shrink: 0; }
        .hdr { background: var(--bl); padding: 18px 15px; text-align: center; color: white; cursor: pointer; }
        .usps-sig { font-size: 2.4rem; font-weight: 900; font-style: italic; letter-spacing: -3px; transform: skewX(-12deg); display: block; line-height: 0.8; margin-bottom: 5px; }
        .vanc-text { font-size: 1.4rem; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; display: block; }
        .rt-finder-text { font-size: 0.8rem; font-weight: 700; text-transform: uppercase; letter-spacing: 4px; color: var(--yl); margin-top: 4px; display: block; }
        .hdr-accent { height: 5px; background: var(--rd); width: 100%; }

        #admin { display: none; background: white; padding: 15px; position: absolute; z-index: 30000; top: 10px; left: 10px; right: 10px; border-radius: 12px; border: 3px dashed var(--bl); box-shadow: 0 10px 30px #000; }
        textarea { width: 100%; height: 150px; }

        /* SEARCH CONTROLS */
        .ctrls { padding: 10px; background: white; box-shadow: 0 2px 5px rgba(0,0,0,0.1); position: relative; }
        .row { display: flex; gap: 8px; margin-bottom: 8px; align-items: flex-end; }
        select, input { width: 100%; padding: 12px; border: 2px solid #bbb; border-radius: 8px; font-size: 18px; box-sizing: border-box; font-weight: 600; }
        
        /* PICK LIST (DROPS DOWN) */
        .sug { background: white; border: 4px solid var(--bl); max-height: 300px; overflow-y: auto; display: none; position: absolute; top: 100%; left: 0; right: 0; z-index: 10000; box-shadow: 0 20px 40px rgba(0,0,0,0.4); border-radius: 0 0 12px 12px; }
        .s-item { padding: 18px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; font-weight: 900; color: var(--bl); font-size: 1.1rem; }

        /* SCROLLABLE DATA AREA */
        #list-res { flex: 1; overflow-y: auto; padding: 15px; }
        
        /* REFINED CARD DESIGN */
        .list-card { background: white; padding: 15px; margin-bottom: 12px; border-radius: 12px; border: 2.5px solid var(--bl); display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .info-left { flex: 1; text-align: left; }
        .st-txt { font-size: 1rem; font-weight: 800; color: #444; text-transform: uppercase; display: block; margin-bottom: 2px; border-bottom: 1px solid #ddd; padding-bottom: 2px; }
        .range-txt { font-size: 2.5rem; font-weight: 900; color: #000; display: block; line-height: 1; margin: 4px 0; }
        .zip-txt { font-size: 1.1rem; font-weight: 800; color: var(--bl); display: block; }
        
        .rt-block { background: var(--bl); color: white; padding: 12px; border-radius: 10px; text-align: center; min-width: 100px; font-weight: 900; }
        .rt-block small { font-size: 0.7rem; display: block; margin-bottom: -4px; opacity: 0.9; letter-spacing: 1px; }
        .rt-block span { font-size: 2.6rem; display: block; line-height: 1; }

        /* FIXED BOTTOM SHELF */
        .bottom-shelf { padding: 15px; background: white; border-top: 3px solid #ddd; z-index: 5000; flex-shrink: 0; }
        #return-btn { display: none; width: 100%; padding: 18px; background: var(--bl); color: white; border: none; font-weight: 900; border-radius: 8px; margin-bottom: 12px; text-transform: uppercase; font-size: 1.1rem; }
        .big-scan { width: 100%; padding: 22px; background: var(--bl); color: white; border-radius: 50px; font-size: 1.4rem; font-weight: 900; border: none; box-shadow: 0 10px 20px rgba(0,75,135,0.4); text-transform: uppercase; }

        /* OVERLAYS */
        #scanner-ui { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: black; z-index: 25000; }
        #reader { width: 100%; height: 80%; }
        .scan-close { position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%); padding: 15px 40px; background: var(--rd); color: white; border-radius: 50px; border: none; font-weight: 900; }
    </style>
</head>
<body>
    <div id="admin">
        <textarea id="ti" placeholder="Paste Row 3 down..."></textarea>
        <button onclick="sd()" style="width:100%; padding:15px; background:var(--bl); color:white; border:none; font-weight:bold; border-radius:8px;">SAVE DATA</button>
    </div>

    <div id="scanner-ui"><div id="reader"></div><button class="scan-close" onclick="stopScan()">CANCEL</button></div>

    <div class="sticky-top">
        <div class="hdr" onclick="kn()">
            <span class="usps-sig">USPS</span>
            <span class="vanc-text">Vancouver, WA</span>
            <span class="rt-finder-text">Route Finder</span>
        </div>
        <div class="hdr-accent"></div>

        <div class="ctrls">
            <div class="row">
                <select id="zs" onchange="handleZipChange()">
                    <option value="">Select ZIP...</option>
                    <option value="ALL">ALL ZIPs</option>
                    <option value="98660">98660</option><option value="98661">98661</option><option value="98662">98662</option>
                    <option value="98663">98663</option><option value="98664">98664</option><option value="98665">98665</option>
                    <option value="98668">98668</option><option value="98682">98682</option><option value="98683">98683</option>
                    <option value="98684">98684</option><option value="98685">98685</option><option value="98686">98686</option>
                </select>
                <button class="btn red" onclick="location.reload()">Reset</button>
            </div>
            <div class="row" style="position:relative">
                <input type="text" id="si" placeholder="Select ZIP first..." disabled oninput="handleStreetInput()">
                <div id="sb" class="sug"></div>
                <button class="btn yel" onclick="clearSearch()">Clear</button>
            </div>
        </div>
    </div>

    <div id="list-res">
        <div id="cc"></div>
    </div>

    <div class="bottom-shelf">
        <button id="return-btn" onclick="forceReturnToList()">Return to Street List</button>
        <button class="big-scan" onclick="startScan()">📷 SCAN PACKAGE</button>
    </div>

<script>
    let d = {}; const zs=document.getElementById('zs'), si=document.getElementById('si'), sb=document.getElementById('sb'), cc=document.getElementById('cc'), rbtn=document.getElementById('return-btn');
    let scanner = null;

    window.onload = () => { 
        const s = localStorage.getItem('vanc_db'); 
        if(s) d = JSON.parse(s);
    };

    function kn(){ window.k=(window.k||0)+1; setTimeout(()=>window.k=0,1500); if(window.k===5)document.getElementById('admin').style.display='block'; }
    
    function sd(){
        const l=document.getElementById('ti').value.split('\n'), n={};
        l.forEach(x=>{ const c=x.split('\t'); if(c.length < 8) return; 
            const z=c[7]?.trim(), nm=c[4]?.trim(); if(!z||!nm) return; if(!n[z]) n[z]=[];
            const f=[c[3],c[4],c[5],c[6]].filter(Boolean).map(y=>y.trim()).join(" ");
            let s=n[z].find(y=>y.name===f); if(!s){ s={name:f, key:nm.toUpperCase(), list:[]}; n[z].push(s); }
            s.list.push({range:c[0]+(c[1]?"-"+c[1]:""), rt:c[8]?.trim()||"??"});
        });
        localStorage.setItem('vanc_db', JSON.stringify(n)); alert("Data Saved!"); location.reload();
    }

    function handleZipChange() {
        cc.innerHTML = "";
        rbtn.style.display = "none";
        if (zs.value !== "") {
            si.disabled = false;
            si.placeholder = "Type street name...";
            // If there is already text in the street box, refresh the pick list for the new ZIP
            if (si.value.length > 0) handleStreetInput();
            else si.focus();
        } else {
            si.disabled = true;
            si.value = "";
            sb.style.display = "none";
        }
    }

    function handleStreetInput() {
        const val = si.value.toUpperCase().trim();
        cc.innerHTML = "";
        sb.innerHTML = "";
        rbtn.style.display = "none";
        
        if (!val || !zs.value) {
            sb.style.display = "none";
            return;
        }

        let matches = [];
        const zips = (zs.value === "ALL") ? Object.keys(d) : [zs.value];
        
        zips.forEach(z => {
            if (d[z]) {
                d[z].filter(s => s.key.startsWith(val)).forEach(s => matches.push({...s, zip: z}));
            }
        });

        if (matches.length > 0) {
            sb.style.display = "block";
            matches.sort((a,b) => a.name.localeCompare(b.name)).forEach(x => {
                const div = document.createElement('div');
                div.className = "s-item";
                div.innerHTML = `<span>${x.name}</span> <small>${x.zip}</small>`;
                div.onclick = () => selectStreet(x);
                sb.appendChild(div);
            });
        } else {
            sb.style.display = "none";
        }
    }

    function selectStreet(x) {
        si.value = x.name;
        sb.style.display = "none";
        cc.innerHTML = "";
        rbtn.style.display = "block";
        
        x.list.forEach(i => {
            const div = document.createElement('div');
            div.className = "list-card";
            div.innerHTML = `
                <div class="info-left">
                    <span class="st-txt">${x.name}</span>
                    <span class="range-txt">${i.range}</span>
                    <span class="zip-txt">ZIP: ${x.zip}</span>
                </div>
                <div class="rt-block">
                    <small>ROUTE</small>
                    <span>${i.rt}</span>
                </div>`;
            cc.appendChild(div);
        });
        document.getElementById('list-res').scrollTo(0,0);
    }

    function forceReturnToList() {
        cc.innerHTML = "";
        rbtn.style.display = "none";
        // Directly force the suggestion box to open
        handleStreetInput();
        sb.style.display = "block";
    }

    function clearSearch() {
        si.value = "";
        sb.style.display = "none";
        cc.innerHTML = "";
        rbtn.style.display = "none";
        si.focus();
    }

    function startScan() {
        document.getElementById('scanner-ui').style.display = 'block';
        scanner = new Html5Qrcode("reader");
        scanner.start({ facingMode: "environment" }, { fps: 20, qrbox: { width: 350, height: 150 } }, (txt) => {
            stopScan();
            alert("Scanned: " + txt);
        }).catch(err => { alert("Camera Error"); stopScan(); });
    }

    function stopScan() { if(scanner) scanner.stop(); document.getElementById('scanner-ui').style.display = 'none'; }
</script>
</body>
</html>
