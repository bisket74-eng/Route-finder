<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vancouver Route Filter</title>
    <style>
        :root { --usps-blue: #004b87; --usps-red: #da291c; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; padding: 15px; background: #f0f2f5; color: #333; }
        h2 { color: var(--usps-blue); border-bottom: 2px solid var(--usps-red); padding-bottom: 10px; margin-top: 0; }
        
        .container { max-width: 500px; margin: auto; }
        label { display: block; font-weight: bold; margin-top: 15px; font-size: 0.9em; color: #666; }
        
        select, input { 
            width: 100%; padding: 14px; margin: 5px 0; border: 2px solid #ddd; 
            border-radius: 10px; font-size: 16px; box-sizing: border-box; 
        }
        
        input:focus { border-color: var(--usps-blue); outline: none; }

        .route-result {
            background: white; margin-top: 10px; padding: 15px;
            border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            display: flex; justify-content: space-between; align-items: center;
        }

        .route-id { background: var(--usps-blue); color: white; padding: 5px 12px; border-radius: 6px; font-weight: bold; }
        .address-info { flex-grow: 1; margin-right: 10px; }
        .footer { text-align: center; margin-top: 30px; font-size: 0.8em; color: #999; }
    </style>
</head>
<body>

<div class="container">
    <h2>Route Filter</h2>

    <label>SELECT VANCOUVER ZIP</label>
    <select id="zipCode">
        <option value="98660">98660 (Downtown)</option>
        <option value="98661">98661</option>
        <option value="98662">98662</option>
        <option value="98663">98663</option>
        <option value="98664">98664</option>
        <option value="98665">98665</option>
        <option value="98666">98666</option>
        <option value="98668">98668</option>
        <option value="98682">98682</option>
        <option value="98683">98683</option>
        <option value="98684">98684</option>
        <option value="98685">98685</option>
        <option value="98686">98686</option>
    </select>

    <label>STREET NAME (Start typing...)</label>
    <input type="text" id="streetSearch" placeholder="e.g. Mill Plain" autocomplete="off">

    <label>STREET NUMBER (Optional)</label>
    <input type="number" id="streetNum" placeholder="e.g. 1200">

    <div id="resultsArea">
        <!-- Results will appear here -->
    </div>

    <div class="footer">
        Updated for Vancouver Postal Clerk Use
    </div>
</div>

<script>
    const streetInput = document.getElementById('streetSearch');
    const zipInput = document.getElementById('zipCode');
    const numInput = document.getElementById('streetNum');
    const resultsArea = document.getElementById('resultsArea');

    // For a truly automated version, you would use a fetch() call here 
    // to a service like SmartyStreets or USPS AIS. 
    // Below is the logic to handle the "Pick List" behavior you requested.

    function lookupRoute() {
        const zip = zipInput.value;
        const street = streetInput.value.trim();
        const num = numInput.value;

        if (street.length < 3) return;

        // Visual Placeholder for now - 
        // This is where you would hook into the real-time data API
        resultsArea.innerHTML = `
            <div class="route-result">
                <div class="address-info">
                    <strong>${num ? num : ''} ${street}</strong><br>
                    Range: 1000 - 1598 (Even)
                </div>
                <div class="route-id">C0${zip.slice(-2)}</div>
            </div>
        `;
    }

    streetInput.addEventListener('input', lookupRoute);
    numInput.addEventListener('input', lookupRoute);
</script>

</body>
</html>
