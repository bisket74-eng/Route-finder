<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Route Sheet Export</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>
<style>
    :root { --bl: #004b87; --lt-bl: #eef4f9; --rd: #da291c; --yl: #ffde00; --gr: #00a651; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, Helvetica, sans-serif; background: var(--lt-bl); color: #111; }
    .wrap { max-width: 640px; margin: 0 auto; padding: 16px; }
    .hdr { background: linear-gradient(135deg, #003a6a 0%, #004b87 50%, #005fa3 100%); color: #fff; padding: 18px 16px; text-align: center; border-bottom: 3px solid var(--rd); }
    .hdr h1 { margin: 0; font-size: 1.5rem; font-weight: 900; text-transform: uppercase; letter-spacing: 1px; }
    .hdr p { margin: 4px 0 0; font-size: 0.8rem; font-weight: 700; opacity: 0.9; text-transform: uppercase; letter-spacing: 1px; }

    .card { background: #fff; border: 2px solid var(--bl); border-radius: 10px; padding: 16px; margin-top: 16px; }
    .card h2 { margin: 0 0 12px; font-size: 1.05rem; color: var(--bl); text-transform: uppercase; letter-spacing: 0.5px; }

    label.field-label { display: block; font-size: 0.8rem; font-weight: 900; color: var(--bl); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
    select#citySelect { width: 100%; padding: 10px; font-size: 1rem; border: 1px solid #aaa; border-radius: 6px; margin-bottom: 4px; }

    #zipScrollBox { max-height: 260px; overflow-y: auto; border: 1px solid #ccc; border-radius: 8px; margin-top: 10px; }
    .zip-item { display: flex; align-items: center; padding: 10px 14px; font-weight: 700; font-size: 0.95rem; border-bottom: 1px solid #e2e2e2; }
    .zip-item:last-child { border-bottom: none; }
    .zip-item input { width: 20px; height: 20px; margin-right: 12px; accent-color: var(--bl); flex-shrink: 0; }

    .toggle-row { display: flex; align-items: center; margin-top: 14px; padding-top: 14px; border-top: 1px solid #ddd; }
    .toggle-row input { width: 20px; height: 20px; margin-right: 12px; accent-color: var(--bl); }
    .toggle-row span { font-weight: 900; font-size: 0.85rem; color: var(--bl); text-transform: uppercase; letter-spacing: 0.5px; }

    .btn-main { width: 100%; margin-top: 16px; padding: 14px; font-size: 1rem; font-weight: 900; text-transform: uppercase; letter-spacing: 0.5px; color: #fff; background: var(--bl); border: none; border-radius: 8px; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
    .btn-main:active { transform: translateY(1px); }
    .btn-secondary { background: #667; }

    .status-msg { margin-top: 10px; font-size: 0.85rem; font-weight: 700; color: var(--rd); text-align: center; }

    #sheetView { display: none; }
    #sheetView .sheet-toolbar { display: flex; gap: 10px; margin-bottom: 14px; }
    #sheetView .sheet-toolbar button { flex: 1; }

    #printArea h1.sheet-title { font-size: 15pt; font-weight: 900; margin: 0 0 2px; text-transform: uppercase; }
    #printArea p.sheet-sub { font-size: 10pt; font-weight: 700; margin: 0 0 12px; color: #333; }
    table.sheet-table { width: 100%; border-collapse: collapse; background: #fff; }
    table.sheet-table th { font-size: 10pt; font-weight: 900; text-transform: uppercase; text-align: left; border-bottom: 2px solid #000; padding: 6px 7px; background: #eef4f9; }
    table.sheet-table td { padding: 5px 7px; }
    table.sheet-table td.c-plain { font-size: 10pt; font-weight: 400; }
    table.sheet-table td.c-bold { font-size: 12pt; font-weight: 900; }
    table.sheet-table tr.grp-end td { border-bottom: 1.5px solid #000; }

    @media print {
        body { background: #fff; }
        .hdr, .card, .sheet-toolbar, .no-print { display: none !important; }
        .wrap { max-width: none; padding: 0; margin: 0; }
        @page { margin: 0.5in; }
    }
</style>
</head>
<body>

<div class="hdr">
    <h1>Route Sheet Export</h1>
    <p>USPS Route Finder</p>
</div>

<div class="wrap">

    <div class="card no-print" id="pickerView">
        <h2>1. City</h2>
        <label class="field-label" for="citySelect">Select city</label>
        <select id="citySelect" onchange="onCityChange()"></select>

        <h2 style="margin-top:18px;">2. ZIP Code(s)</h2>
        <div id="zipScrollBox"></div>

        <div class="toggle-row">
            <input type="checkbox" id="colorCodeToggle">
            <span>Color-code by route</span>
        </div>

        <button class="btn-main" type="button" onclick="generateSheet()">Generate Print Sheet</button>
        <div class="status-msg" id="statusMsg"></div>
    </div>

    <div class="card no-print" id="sheetView">
        <div class="sheet-toolbar">
            <button class="btn-main" type="button" onclick="window.print()">Print / Save as PDF</button>
            <button class="btn-main btn-secondary" type="button" onclick="backToPicker()">Back</button>
        </div>
    </div>

    <div id="printArea"></div>

</div>

// ==========================================================================
// STATE
// ==========================================================================
let currentRows = [];      // raw parsed rows for the currently loaded city
let currentCityKey = null;

const params = new URLSearchParams(window.location.search);
const requestedCity = params.get('city');

// ==========================================================================
// INIT
// ==========================================================================
function populateCityDropdown() {
    const sel = document.getElementById('citySelect');
    const keys = Object.keys(CITY_CONFIG).sort((a, b) => CITY_CONFIG[a].name.localeCompare(CITY_CONFIG[b].name));
    sel.innerHTML = keys.map(k => `<option value="${k}">${escapeHtml(CITY_CONFIG[k].name)}</option>`).join('');
    if (requestedCity && CITY_CONFIG[requestedCity]) {
        sel.value = requestedCity;
    } else if (keys.length) {
        sel.value = keys[0];
    }
}

async function onCityChange() {
    const key = document.getElementById('citySelect').value;
    currentCityKey = key;
    const statusEl = document.getElementById('statusMsg');
    statusEl.textContent = 'Loading route data...';
    document.getElementById('zipScrollBox').innerHTML = '';
    try {
        const cfg = CITY_CONFIG[key];
        const resp = await fetch(cfg.url + '?v=' + Date.now());
        const ab = await resp.arrayBuffer();
        const wb = XLSX.read(ab, { type: 'array' });
        currentRows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1 });
        buildZipCheckboxes(key);
        statusEl.textContent = '';
    } catch (err) {
        console.error(err);
        currentRows = [];
        statusEl.textContent = 'Could not load route data for this city. Check your connection and try again.';
    }
}

function buildZipCheckboxes(key) {
    const cfg = CITY_CONFIG[key];
    const box = document.getElementById('zipScrollBox');
    box.innerHTML = '';

    const zipsInData = new Set();
    currentRows.forEach(r => {
        const z = r[7] ? r[7].toString().trim() : '';
        if (z && z.toUpperCase() !== 'ZIP') zipsInData.add(z);
    });
    let zips = Array.from(zipsInData);
    if (zips.length === 0) {
        zips = Array.from(new Set([...(cfg.stationMOU || []), ...(cfg.stationDCU || [])]));
    }
    zips.sort();

    if (zips.length === 0) {
        box.innerHTML = '<div class="zip-item">No ZIP data found for this city.</div>';
        return;
    }

    const allLabel = document.createElement('label');
    allLabel.className = 'zip-item';
    allLabel.innerHTML = `<input type="checkbox" id="allZipsToggle" onchange="toggleAllZips(this)"> ALL ZIPs`;
    box.appendChild(allLabel);

    zips.forEach(zip => {
        const lbl = document.createElement('label');
        lbl.className = 'zip-item';
        const displayLabel = (cfg.zipLabels && cfg.zipLabels[zip]) ? cfg.zipLabels[zip] : zip;
        lbl.innerHTML = `<input type="checkbox" class="zip-chk" value="${zip}"> ${escapeHtml(displayLabel)}`;
        box.appendChild(lbl);
    });
}

function toggleAllZips(masterEl) {
    document.querySelectorAll('.zip-chk').forEach(c => { c.checked = masterEl.checked; });
}

// ==========================================================================
// RECORD BUILDING / SORTING / GROUPING
// ==========================================================================
function escapeHtml(str) {
    return (str === undefined || str === null ? '' : str.toString())
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function buildPrintRecords(rows, zipFilterSet) {
    const recs = [];
    rows.forEach(c => {
        const zip = c[7] !== undefined && c[7] !== null ? c[7].toString().trim() : '';
        const street = c[4] !== undefined && c[4] !== null ? c[4].toString().trim() : '';
        if (!zip || !street || zip.toUpperCase() === 'ZIP') return;
        if (zipFilterSet && zipFilterSet.size > 0 && !zipFilterSet.has(zip)) return;

        const low = (c[0] !== undefined && c[0] !== null) ? c[0].toString().trim() : '';
        const high = (c[1] !== undefined && c[1] !== null) ? c[1].toString().trim() : '';

        let oebRaw = (c[2] !== undefined && c[2] !== null) ? c[2].toString().trim().toUpperCase().replace(/[()]/g, '') : '';
        let oeb = '';
        if (oebRaw.includes('B')) oeb = 'B';
        else if (oebRaw.includes('O')) oeb = 'O';
        else if (oebRaw.includes('E')) oeb = 'E';
        else oeb = oebRaw;

        const preDir = (c[3] !== undefined && c[3] !== null) ? c[3].toString().trim().toUpperCase() : '';
        const suffix = (c[5] !== undefined && c[5] !== null) ? c[5].toString().trim().toUpperCase() : '';
        const postDir = (c[6] !== undefined && c[6] !== null) ? c[6].toString().trim().toUpperCase() : '';
        const directional = [preDir, postDir].filter(Boolean).join(' ');
        const route = (c[8] !== undefined && c[8] !== null) ? c[8].toString().trim() : '';

        recs.push({ directional, street: street.toUpperCase(), suffix, low, high, oeb, route, zip });
    });
    return recs;
}

function streetSortKey(s) {
    const m = s.match(/^(\d+)/);
    if (m) return [0, parseInt(m[1], 10), s];
    return [1, 0, s];
}

function compareRecords(a, b) {
    const ka = streetSortKey(a.street), kb = streetSortKey(b.street);
    if (ka[0] !== kb[0]) return ka[0] - kb[0];
    if (ka[1] !== kb[1]) return ka[1] - kb[1];
    if (ka[2] !== kb[2]) return ka[2] < kb[2] ? -1 : 1;
    if (a.directional !== b.directional) return a.directional < b.directional ? -1 : 1;
    if (a.suffix !== b.suffix) return a.suffix < b.suffix ? -1 : 1;
    const la = parseFloat(a.low) || 0, lb = parseFloat(b.low) || 0;
    return la - lb;
}

// Evenly-spread pastel colors for route color-coding (golden-angle hue steps
// keep adjacent routes from landing on similar hues, even with many routes).
function colorForRouteIndex(index) {
    const hue = (index * 137.508) % 360;
    return `hsl(${hue.toFixed(0)}, 62%, 84%)`;
}

function buildRouteColorMap(records) {
    const uniqueRoutes = Array.from(new Set(records.map(r => r.route || '\u2014'))).sort();
    const map = {};
    uniqueRoutes.forEach((rt, i) => { map[rt] = colorForRouteIndex(i); });
    return map;
}

// ==========================================================================
// GENERATE / RENDER
// ==========================================================================
function generateSheet() {
    const statusEl = document.getElementById('statusMsg');
    const checked = Array.from(document.querySelectorAll('.zip-chk:checked')).map(c => c.value);
    if (checked.length === 0) {
        statusEl.textContent = 'Select at least one ZIP code first.';
        return;
    }
    if (!currentRows || currentRows.length === 0) {
        statusEl.textContent = 'No route data loaded for this city yet.';
        return;
    }

    const zipFilterSet = new Set(checked);
    const showZipColumn = checked.length > 1;
    const colorCode = document.getElementById('colorCodeToggle').checked;

    const records = buildPrintRecords(currentRows, zipFilterSet).sort(compareRecords);
    if (records.length === 0) {
        statusEl.textContent = 'No entries found for the selected ZIP(s).';
        return;
    }
    statusEl.textContent = '';

    const routeColorMap = colorCode ? buildRouteColorMap(records) : null;

    const cfg = CITY_CONFIG[currentCityKey];
    const cityName = cfg ? cfg.name : 'Route Sheet';
    const zipLine = checked.map(z => (cfg.zipLabels && cfg.zipLabels[z]) ? cfg.zipLabels[z] : z).join(', ');
    const todayStr = new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });

    let bodyRows = '';
    records.forEach((r, i) => {
        const isGroupEnd = (i === records.length - 1) || (records[i + 1].street !== r.street);
        const rowClass = isGroupEnd ? ' class="grp-end"' : '';
        const rowStyle = routeColorMap ? ` style="background-color:${routeColorMap[r.route || '\u2014']};"` : '';
        bodyRows += `<tr${rowClass}${rowStyle}>
            <td class="c-plain">${escapeHtml(r.directional)}</td>
            <td class="c-bold">${escapeHtml(r.street)}</td>
            <td class="c-plain">${escapeHtml(r.suffix)}</td>
            <td class="c-plain">${escapeHtml(r.low)}</td>
            <td class="c-plain">${escapeHtml(r.high)}</td>
            <td class="c-plain">${escapeHtml(r.oeb)}</td>
            <td class="c-bold">${escapeHtml(r.route)}</td>
            ${showZipColumn ? `<td class="c-plain">${escapeHtml(r.zip)}</td>` : ``}
        </tr>`;
    });

    const zipHeaderCell = showZipColumn ? `<th>ZIP</th>` : ``;

    document.getElementById('printArea').innerHTML = `
        <h1 class="sheet-title">${escapeHtml(cityName)}</h1>
        <p class="sheet-sub">ZIP(s): ${escapeHtml(zipLine)} &bull; Generated ${todayStr}</p>
        <table class="sheet-table">
            <thead><tr><th>Dir</th><th>Street</th><th>Suffix</th><th>Low</th><th>High</th><th>O/E/B</th><th>Route</th>${zipHeaderCell}</tr></thead>
            <tbody>${bodyRows}</tbody>
        </table>
    `;

    document.getElementById('pickerView').style.display = 'none';
    document.getElementById('sheetView').style.display = 'block';
    window.scrollTo(0, 0);
}

function backToPicker() {
    document.getElementById('sheetView').style.display = 'none';
    document.getElementById('pickerView').style.display = 'block';
}

// ==========================================================================
// BOOT
// ==========================================================================
window.addEventListener('DOMContentLoaded', () => {
    populateCityDropdown();
    onCityChange();
});

</script>
